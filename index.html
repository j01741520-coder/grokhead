<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grok Bot · 3D</title>
<!-- Grok Bot 3D avatar. Rendering by three.js (MIT License, Copyright © 2010-2024 three.js authors, https://threejs.org), bundled inline. -->
<style>
:root{--fg:#26272b;--dim:rgba(38,39,43,.55);--pill:rgba(255,255,255,.58);--bd:rgba(0,0,0,.07);--sh:0 8px 30px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);--acc:#2b6cff;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif}
body.dark{--fg:#e9ecf3;--dim:rgba(233,236,243,.5);--pill:rgba(30,32,40,.55);--bd:rgba(255,255,255,.08);--sh:0 8px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#e4e4e4;font-family:var(--font);color:var(--fg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.dark{background:#15161a}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#cv:active{cursor:grabbing}
#ui{position:fixed;inset:0;pointer-events:none;transition:opacity .4s}
body.noui #ui{display:none}
#brand{position:fixed;left:22px;top:18px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:.01em}
#brand .dot{width:9px;height:9px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 3px var(--bd)}
#state{font-weight:500;font-size:12px;color:var(--dim);padding:3px 10px;border-radius:99px;background:var(--pill);border:1px solid var(--bd);transition:all .3s}
#bar{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:var(--pill);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);pointer-events:auto}
#bar button{font:inherit;color:var(--fg);border:none;background:none;cursor:pointer;border-radius:999px;height:30px;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .2s,transform .15s}
#bar button:hover{background:rgba(127,127,140,.14)}
#bar button:active{transform:scale(.94)}
.sw{width:30px;padding:0}
.sw i{display:block;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on{background:rgba(127,127,140,.16)!important}
.sw.on i{box-shadow:0 0 0 2px var(--pill),0 0 0 3.5px var(--fg)}
.m1 i{background:radial-gradient(circle at 35% 30%,#6b6b72 0,#1a1a1d 28%,#050506 60%)}
.m2 i{background:radial-gradient(circle at 40% 35%,#5a5a60,#1c1c20 55%,#0b0b0d),#111;filter:blur(.3px);box-shadow:0 0 0 1.5px rgba(60,60,66,.35)}
.m3 i{background:radial-gradient(circle at 50% 55%,#cfe3ff 0,#6a8cff 18%,#20242f 45%,#0d0e12 70%)}
.m4 i{background:radial-gradient(circle,#050507 52%,#33e6ff 66%,#ff4fe6 80%,#050507 92%)}
.m5 i{border-radius:4px;background:conic-gradient(#111 25%,#2a2a2e 0 50%,#111 0 75%,#2a2a2e 0) 0 0/8px 8px}
.sep{width:1px;height:18px;background:var(--bd);margin:0 4px}
.tb{padding:0 11px;font-size:12px;font-weight:500}
.tb b{font-size:11px;font-weight:600;opacity:.55;border:1px solid var(--bd);border-radius:5px;padding:0 4px;line-height:15px}
.tb.on{background:rgba(127,127,140,.18)!important}
#recDot{width:7px;height:7px;border-radius:50%;background:#ff3b30;display:none}
.rec #recDot{display:block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:11.5px;color:var(--dim);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
#hint span{opacity:.6;margin:0 6px}
#hint kbd{font:inherit;font-weight:600;color:var(--fg);opacity:.8}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-8px);padding:7px 14px;font-size:12px;border-radius:99px;background:var(--pill);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(12px);opacity:0;transition:all .35s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:14px;color:#555;text-align:center;padding:30px}
@media (max-width:640px){#bar{bottom:40px;gap:2px;padding:5px}.tb{padding:0 7px}.tb span{display:none}#hint{font-size:10px}}
</style></head><body>
